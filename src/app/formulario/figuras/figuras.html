
<div class="col-6">
    <div class="mb-3">
        <form action="">

            <br><br>

            <h1>Areas de figuras</h1>

            <div class="form-group pt-4">
                <label for="num1" class="form-label">Numero 1:</label>
                <input [(ngModel)]="num1"type="number" name="num1" class="form-control" id="num1" placeholder="Ingresa numero 1">
            </div>

            <div class="form-group pt-4">
                <label for="num2" class="form-label">Numero 2:</label>
                <input [(ngModel)]="num2" type="number" name="num2" class="form-control" id="num2" placeholder="Ingresa numero 2">
            </div>

            <br>

            <input [(ngModel)]="area" type="radio" name="ejercicio" value="cuadrado">
            <label>Cuadrado</label>
            <br><br>

            <input [(ngModel)]="area" type="radio" name="ejercicio" value="rectangulo">
            <label>Rectangulo</label>
            <br><br>

            <input [(ngModel)]="area" type="radio" name="ejercicio" value="circulo">
            <label>Circulo</label>
            <br><br>

            <input [(ngModel)]="area" type="radio" name="ejercicio" value="pentagono">
            <label>Pentagono</label>
            <br><br>

            <input [(ngModel)]="area" type="radio" name="ejercicio"    value="triangulo">
            <label>Triangulo</label>
            <br><br>

            <button (click)="ejercicio()" type="button" class="btn btn-primary">Resultado</button>
        </form>
    </div>
</div>

<div class="col-6">
    <h2>Resultado: {{resultado}}</h2>
</div>
